name: Build Chroma Strain APK

on:
  push:
    branches: ["**"]
    paths:
      - "ChromaStrain/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "ChromaStrain/**"
  workflow_dispatch:

jobs:
  gradle-apk:
    name: Gradle debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p ChromaStrain assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChromaStrain-debug-apk
          path: ChromaStrain/app/build/outputs/apk/debug/app-debug.apk

  sdkless-apk:
    name: SDK-less pipeline APK (fallback)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build with scripts/build_apk.py
        run: python3 ChromaStrain/scripts/build_apk.py

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChromaStrain-nosdk-apk
          path: ChromaStrain/dist/ChromaStrain-debug.apk

  headless-sim:
    name: Headless gameplay simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Bot plays every operation with every faction
        run: bash ChromaStrain/scripts/run_sim.sh
